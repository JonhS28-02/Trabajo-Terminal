name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "mlops/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "mlops/**"]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # Si un cambio de código o de dependencias altera las predicciones, el despliegue se detiene aquí.
      - name: El modelo reproduce las predicciones de referencia
        run: python mlops/validar_modelo.py
      - name: El backend importa y las migraciones están al día con los modelos
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/braintest
          SECRET_KEY: clave-solo-para-ci
        run: |
          alembic upgrade head
          alembic check
          python -c "from app.main import app"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: braintest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10

  desplegar:
    needs: validar
    if: github.event_name == 'push' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/braintest-api:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/braintest-api:latest
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ vars.ACR_LOGIN_SERVER }}/braintest-api:${{ github.sha }}
      - name: Comprobar que el servicio responde con el modelo cargado
        run: |
          sleep 60
          curl --fail --silent --max-time 90 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/modelo/info"
